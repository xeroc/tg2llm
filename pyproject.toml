[project]
name = "tg-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.45.0",
]

[project.scripts]
tg = "tg:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tg.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
